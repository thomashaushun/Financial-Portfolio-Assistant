<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-4">Create Account</h1>

                    <form th:action="@{/register}" th:object="${registerUserRequest}" method="post">
                        <div class="mb-3">
                            <label for="displayName" class="form-label">Display Name</label>
                            <input
                                    id="displayName"
                                    type="text"
                                    th:field="*{displayName}"
                                    class="form-control"
                                    required>
                            <div
                                    class="text-danger small mt-1"
                                    th:if="${#fields.hasErrors('displayName')}"
                                    th:errors="*{displayName}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input
                                    id="email"
                                    type="email"
                                    th:field="*{email}"
                                    class="form-control"
                                    required>
                            <div
                                    class="text-danger small mt-1"
                                    th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input
                                    id="password"
                                    type="password"
                                    th:field="*{password}"
                                    class="form-control"
                                    required>
                            <div
                                    class="text-danger small mt-1"
                                    th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Create Account
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <a th:href="@{/login}">Back to login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
