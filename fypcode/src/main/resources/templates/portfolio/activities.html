<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Activities</title>

    <!--
    CSRF metadata used by portfolio-activities.js.
    Spring Security requires CSRF tokens for modifying requests such as POST, PUT and DELETE.
    The JavaScript reads these values and adds the token to activity create/update/delete requests.
    -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <!--
    Shared portfolio header.
    This inserts the reusable portfolio navigation/header fragment.
    Arguments:
    - "Portfolio Activities" is the page title.
    - "Add, edit, and remove portfolio activities." is the page subtitle.
    - "activities" marks the Activities navigation button as active.
    -->
    <div th:replace="~{fragments/portfolio-header :: portfolioHeader('Portfolio Activities', 'Add, edit, and remove portfolio activities.', 'activities')}"></div>

    <!--
    Page-level alert container.
    portfolio-activities.js uses this to show success/error messages for loading, deleting, and successful saves.
    Form-specific validation errors are shown inside the modal instead.
    -->
    <div id="alertContainer"></div>

    <!--
    Top summary/action area.
    The Add Activity button opens the Bootstrap modal in create mode.
    summaryActivityCount is filled by JavaScript after GET /api/portfolio/activities.
    -->
    <div class="row g-3 mb-4">
        <div class="ms-3">
            <button id="openCreateModalButton" class="btn btn-success">
                Add Activity
            </button>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Total Activities</div>
                    <div id="summaryActivityCount" class="fs-4 fw-semibold">0</div>
                </div>
            </div>
        </div>
    </div>

    <!--
    Activity list section.
    portfolio-activities.js switches between loadingState, emptyState and tableContainer.
    The actual rows are created dynamically in the activitiesTableBody element.
    -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Activity List</h2>

                <!-- Reloads the activity list from GET /api/portfolio/activities. -->
                <button id="refreshButton" class="btn btn-sm btn-outline-primary" type="button">
                    Refresh
                </button>
            </div>

            <!-- Shown while the activity list API request is running. -->
            <div id="loadingState" class="text-muted">Loading activities...</div>

            <!-- Shown when the backend returns no activities. -->
            <div id="emptyState" class="alert alert-info d-none mb-0">
                No activities found. Add your first activity.
            </div>

            <!--
            Activity table.
            The table body starts empty because rows are rendered by portfolio-activities.js.
            Each rendered row includes Edit and Delete buttons with the activity ID stored in data-id.
            -->
            <div id="tableContainer" class="table-responsive d-none">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Type</th>
                        <th scope="col">Asset Type</th>
                        <th scope="col">Asset</th>
                        <th scope="col" class="text-end">Quantity</th>
                        <th scope="col" class="text-end">Unit Price</th>
                        <th scope="col" class="text-end">Fee</th>
                        <th scope="col">Currency</th>
                        <th scope="col">Comment</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="activitiesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!--
Add/Edit Activity modal.
The same modal is reused for both creating and editing activities.
If activityId is empty, portfolio-activities.js sends POST /api/portfolio/activities.
If activityId has a value, portfolio-activities.js sends PUT /api/portfolio/activities/{id}.
-->
<div class="modal fade" id="activityModal" tabindex="-1" aria-labelledby="activityModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="activityForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="activityModalLabel">Add Activity</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <!-- Hidden ID used to decide create mode vs edit mode. -->
                    <input type="hidden" id="activityId">

                    <div class="row g-3">
                        <!--
                        Activity Type controls the high-level activity behaviour.
                        BUY and SELL require asset details.
                        FEE only requires a fee value.
                        Cash/manual update types are supported by the enum and backend service rules.
                        -->
                        <div class="col-md-6">
                            <label for="type" class="form-label">Activity Type</label>
                            <select class="form-select" id="type" required>
                                <option value="">Select activity type</option>
                                <option value="BUY">BUY</option>
                                <option value="SELL">SELL</option>
                                <option value="FEE">FEE</option>
                                <option value="CASH_DEPOSIT">CASH_DEPOSIT</option>
                                <option value="CASH_WITHDRAWAL">CASH_WITHDRAWAL</option>
                                <option value="MANUAL_ASSET_UPDATE">MANUAL_ASSET_UPDATE</option>
                            </select>
                        </div>

                        <!--
                        Asset Type controls which form fields are shown.
                        Market assets use asset search.
                        Real estate/manual assets use manual name/value fields.
                        -->
                        <div class="col-md-6">
                            <label for="assetType" class="form-label">Asset Type</label>
                            <select class="form-select" id="assetType">
                                <option value="">Select asset type</option>
                                <option value="EQUITY">EQUITY/STOCKS</option>
                                <option value="ETF">ETF</option>
                                <option value="BOND">BOND</option>
                                <option value="CRYPTO">CRYPTO</option>
                                <option value="FOREX">FOREX</option>
                                <option value="COMMODITY">COMMODITY</option>
                                <option value="REAL_ESTATE">REAL_ESTATE</option>
                                <option value="ART">ART</option>
                                <option value="OTHER_MANUAL">OTHER_MANUAL</option>
                            </select>
                        </div>

                        <!--
                        Market asset search.
                        Used for assets such as EQUITY, ETF, BOND, CRYPTO, FOREX and COMMODITY.
                        The visible input is for searching.
                        The hidden symbol/displayName fields store the selected search result sent to the backend.
                        -->
                        <div class="col-md-6" id="marketSearchGroup">
                            <label for="assetSearch" class="form-label">Search Asset</label>
                            <input type="text" class="form-control" id="assetSearch" autocomplete="off">
                            <input type="hidden" id="symbol">
                            <input type="hidden" id="displayName">
                            <div id="assetSearchResults" class="list-group mt-2 d-none"></div>
                            <div class="form-text">Type the asset name and choose a result.</div>
                        </div>

                        <!--
                        Manual asset name.
                        Shown for manual assets such as ART, OTHER_MANUAL and REAL_ESTATE.
                        -->
                        <div class="col-md-6 d-none" id="manualNameGroup">
                            <label for="manualDisplayName" class="form-label">Asset Name</label>
                            <input type="text" class="form-control" id="manualDisplayName" maxlength="150">
                        </div>

                        <!--
                        Real estate address.
                        Shown only when assetType is REAL_ESTATE.
                        -->
                        <div class="col-md-6 d-none" id="addressGroup">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" maxlength="255">
                        </div>

                        <!-- Activity date/time is converted to ISO format before being sent to the backend. -->
                        <div class="col-md-6">
                            <label for="date" class="form-label">Date</label>
                            <input type="datetime-local" class="form-control" id="date" required>
                        </div>

                        <!--
                        Quantity is shown for market BUY/SELL assets.
                        It is hidden/cleared for real estate and manual assets because those are value-based entries.
                        -->
                        <div class="col-md-4" id="quantityGroup">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" step="0.000001" class="form-control" id="quantity">
                        </div>

                        <!-- Unit Price / Value is used as price for market assets and as total value for manual assets. -->
                        <div class="col-md-4">
                            <label for="unitPrice" class="form-label">Unit Price / Value</label>
                            <input type="number" step="0.000001" class="form-control" id="unitPrice">
                        </div>

                        <!-- Fee defaults to 0 and is required to be positive for FEE activity type. -->
                        <div class="col-md-4">
                            <label for="fee" class="form-label">Fee</label>
                            <input type="number" step="0.000001" class="form-control" id="fee" value="0">
                        </div>

                        <!-- Currency is normalised to uppercase in JavaScript before sending the payload. -->
                        <div class="col-md-6">
                            <label for="currency" class="form-label">Currency</label>
                            <input type="text" class="form-control" id="currency" maxlength="3" required>
                        </div>

                        <div class="col-md-6">
                            <label for="comment" class="form-label">Comment</label>
                            <input type="text" class="form-control" id="comment" maxlength="500">
                        </div>
                    </div>

                    <!--
                    Form-level error container.
                    Used for validation errors or save failures inside the modal.
                    Page-level alerts are shown in alertContainer.
                    -->
                    <div id="formError" class="alert alert-danger mt-3 d-none"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="saveActivityButton" class="btn btn-primary">Save Activity</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap is required for the modal. portfolio-activities.js controls CRUD, search, rendering and validation. -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script th:src="@{/js/portfolio-activities.js}"></script>
</body>
</html>
