<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Allocation</title>

    <!--
    CSRF metadata is included for consistency with other portfolio pages.
    The current allocation page only performs GET requests, so CSRF is not actively needed here unless write actions are added later.
    -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!--
    Chart container sizing.
    Chart.js needs a defined container height so charts render at a readable size.
    The media query reduces chart height on smaller screens.
    -->
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        @media (max-width: 768px) {
            .chart-container {
                height: 220px;
            }
        }
    </style>
</head>
<body>
<div class="container py-4">
    <!--
    Shared portfolio header.
    This inserts the reusable portfolio navigation/header fragment.
    Arguments:
    - "Portfolio Allocation" is the page title.
    - "View how your portfolio is distributed across holdings and categories." is the page subtitle.
    - "allocation" marks the Allocation navigation button as active.
    -->
    <div th:replace="~{fragments/portfolio-header :: portfolioHeader('Portfolio Allocation', 'View how your portfolio is distributed across holdings and categories.', 'allocation')}"></div>

    <!--
    Page-level alert container.
    portfolio-allocation.js uses this to show errors if GET /api/portfolio/allocation fails.
    -->
    <div id="alertContainer"></div>

    <!--
    Refresh button.
    This reloads allocation data from the backend.
    It does not modify portfolio data.
    -->
    <div class="d-flex justify-content-end mb-3">
        <button id="refreshAllocationButton" type="button" class="btn btn-primary">
            Refresh Allocation
        </button>
    </div>

    <!-- Shown while allocation data is being loaded from the backend. -->
    <div id="loadingState" class="text-muted mb-3 d-none">Loading allocation...</div>

    <!--
    Main allocation content.
    Hidden until portfolio-allocation.js receives allocation data.
    Each section contains both a Chart.js canvas and a table body.
    -->
    <div id="allocationContent" class="d-none">
        <div class="row g-4">
            <!--
            Allocation by individual holding.
            Backend provides result.byHolding.
            JavaScript renders both byHoldingChart and byHoldingTableBody.
            -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">By Holding</h2>
                        <div class="chart-container">
                            <canvas id="byHoldingChart"></canvas>
                        </div>
                        <div class="table-responsive mt-3">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Holding</th>
                                    <th class="text-end">Value</th>
                                    <th class="text-end">Weight</th>
                                </tr>
                                </thead>
                                <tbody id="byHoldingTableBody">
                                <tr>
                                    <td colspan="3" class="text-muted">No data yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!--
            Allocation by asset class.
            Backend provides result.byAssetClass.
            Asset class metadata comes from holdings/asset profile data.
            -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">By Asset Class</h2>
                        <div class="chart-container">
                            <canvas id="byAssetClassChart"></canvas>
                        </div>
                        <div class="table-responsive mt-3">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Asset Class</th>
                                    <th class="text-end">Value</th>
                                    <th class="text-end">Weight</th>
                                </tr>
                                </thead>
                                <tbody id="byAssetClassTableBody">
                                <tr>
                                    <td colspan="3" class="text-muted">No data yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!--
            Allocation by sector.
            Backend provides result.bySector.
            This helps users understand concentration in sectors such as technology, finance, etc.
            -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">By Sector</h2>
                        <div class="chart-container">
                            <canvas id="bySectorChart"></canvas>
                        </div>
                        <div class="table-responsive mt-3">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Sector</th>
                                    <th class="text-end">Value</th>
                                    <th class="text-end">Weight</th>
                                </tr>
                                </thead>
                                <tbody id="bySectorTableBody">
                                <tr>
                                    <td colspan="3" class="text-muted">No data yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!--
            Allocation by market.
            Backend provides result.byMarket.
            This helps show exposure by exchange/market/region where available.
            -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">By Market</h2>
                        <div class="chart-container">
                            <canvas id="byMarketChart"></canvas>
                        </div>
                        <div class="table-responsive mt-3">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Market</th>
                                    <th class="text-end">Value</th>
                                    <th class="text-end">Weight</th>
                                </tr>
                                </thead>
                                <tbody id="byMarketTableBody">
                                <tr>
                                    <td colspan="3" class="text-muted">No data yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!--
            Allocation by currency.
            Backend provides result.byCurrency.
            This shows currency exposure, but the frontend does not perform currency conversion.
            -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-3">By Currency</h2>
                        <div class="chart-container">
                            <canvas id="byCurrencyChart" height="220"></canvas>
                        </div>
                        <div class="table-responsive mt-3">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Currency</th>
                                    <th class="text-end">Value</th>
                                    <th class="text-end">Weight</th>
                                </tr>
                                </thead>
                                <tbody id="byCurrencyTableBody">
                                <tr>
                                    <td colspan="3" class="text-muted">No data yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--
    Empty state.
    Shown when the backend returns no allocation groups.
    This usually means there are no holdings/activities to allocate yet.
    -->
    <div id="emptyState" class="alert alert-info d-none mt-3">
        No allocation data is available.
    </div>
</div>

<!--
Chart.js is loaded first because portfolio-allocation.js uses it to create doughnut charts.
portfolio-allocation.js controls API loading, table rendering, chart rendering and error handling.
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/portfolio-allocation.js}"></script>
</body>
</html>
