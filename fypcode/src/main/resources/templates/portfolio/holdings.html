<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Holdings</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <!--
    Shared portfolio header.
    This inserts the reusable portfolio navigation/header fragment.
    Arguments:
    - "Portfolio Holdings" is the page title.
    - "Current holdings derived from portfolio activities." is the page subtitle.
    - "holdings" marks the Holdings navigation button as active.
    -->
    <div th:replace="~{fragments/portfolio-header :: portfolioHeader('Portfolio Holdings', 'Current holdings derived from portfolio activities.', 'holdings')}"></div>

    <!--
    Page-level alert container.
    portfolio-holdings.js uses this to show errors if GET /api/portfolio/holdings fails.
    -->
    <div id="alertContainer"></div>

    <!--
    Holdings summary cards.
    These cards are filled by portfolio-holdings.js after it receives the HoldingResponse list from the backend.
    The backend derives individual holdings from activities; the frontend only sums returned values for these summary cards.
    -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Total Holdings</div>
                    <!-- Number of holding rows returned by GET /api/portfolio/holdings. -->
                    <div id="summaryHoldingsCount" class="fs-4 fw-semibold">0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Total Cost Basis</div>
                    <!-- Sum of totalCost values from the returned holdings list. -->
                    <div id="summaryTotalCost" class="fs-4 fw-semibold">-</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Total Market Value</div>
                    <!-- Sum of marketValue values from the returned holdings list. -->
                    <div id="summaryMarketValue" class="fs-4 fw-semibold">-</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small">Unrealized Gain/Loss</div>
                    <!-- Sum of unrealizedGainLoss values; colour-coded in portfolio-holdings.js. -->
                    <div id="summaryGainLoss" class="fs-4 fw-semibold">-</div>
                </div>
            </div>
        </div>
    </div>

    <!--
    Holdings list section.
    portfolio-holdings.js switches between loadingState, emptyState and tableContainer.
    The table body starts empty and is filled dynamically from backend HoldingResponse objects.
    -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Holdings List</h2>

                <!-- Reloads the holdings list from GET /api/portfolio/holdings. -->
                <button id="refreshButton" class="btn btn-sm btn-primary">Refresh</button>
            </div>

            <!-- Shown while GET /api/portfolio/holdings is running. -->
            <div id="loadingState" class="text-muted">Loading holdings...</div>

            <!-- Shown when the backend returns no holdings. -->
            <div id="emptyState" class="alert alert-info d-none mb-0">
                No holdings found. Add activities first.
            </div>

            <!--
            Holdings table.
            The frontend does not calculate holdings from BUY/SELL activities.
            It only renders the HoldingResponse list calculated by backend HoldingService.
            -->
            <div class="table-responsive d-none" id="tableContainer">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Symbol</th>
                        <th scope="col" class="text-end">Quantity</th>
                        <th scope="col" class="text-end">Average Cost</th>
                        <th scope="col" class="text-end">Total Cost</th>
                        <th scope="col" class="text-end">Latest Price</th>
                        <th scope="col" class="text-end">Market Value</th>
                        <th scope="col" class="text-end">Gain/Loss</th>
                        <th scope="col" class="text-end">Gain/Loss %</th>
                        <th scope="col">Currency</th>
                    </tr>
                    </thead>

                    <!-- portfolio-holdings.js creates one row per returned holding. -->
                    <tbody id="holdingsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- portfolio-holdings.js controls API loading, rendering, formatting and gain/loss colour-coding for this page. -->
<script th:src="@{/js/portfolio-holdings.js}"></script>
</body>
</html>
