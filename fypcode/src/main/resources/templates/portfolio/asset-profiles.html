<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asset Profiles</title>

    <!--
    CSRF metadata used by portfolio-asset-profiles.js.
    Spring Security requires CSRF tokens for modifying requests such as POST, PUT and DELETE.
    The JavaScript reads these values and sends them with create/update/delete requests.
    -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <!--
    Shared portfolio header.
    This inserts the reusable portfolio navigation/header fragment.
    Arguments:
    - "Asset Profiles" is the page title.
    - "Manage metadata for portfolio assets." is the page subtitle.
    - "asset-profiles" marks the Asset Profiles navigation button as active.
    -->
    <div th:replace="~{fragments/portfolio-header :: portfolioHeader('Asset Profiles', 'Manage metadata for portfolio assets.', 'asset-profiles')}"></div>

    <!--
    Page-level alert container.
    portfolio-asset-profiles.js uses this for success/error messages after loading, saving or deleting profiles.
    Form-specific errors are shown inside the modal using formError.
    -->
    <div id="alertContainer"></div>

    <!--
    Opens the create/edit modal in create mode.
    This button does not save anything directly; it only opens the form.
    -->
    <div class="d-flex justify-content-end mb-3">
        <button id="openCreateModalButton" class="btn btn-primary" type="button">
            Add Asset for profile
        </button>
    </div>

    <!--
    Asset profile list section.
    portfolio-asset-profiles.js switches between:
    - loadingState while profiles are being loaded.
    - emptyState when no profiles exist.
    - tableContainer when profile data exists.
    -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Asset Profiles</h2>

                <!-- Reloads asset profiles from GET /api/asset-profiles. -->
                <button id="refreshButton" class="btn btn-sm btn-outline-primary" type="button">
                    Refresh
                </button>
            </div>

            <!-- Shown while GET /api/asset-profiles is running. -->
            <div id="loadingState" class="text-muted">Loading asset profiles...</div>

            <!-- Shown when the backend returns no asset profiles. -->
            <div id="emptyState" class="alert alert-info d-none mb-0">
                No asset profiles found. Add one to start classifying your assets.
            </div>

            <!--
            Asset profiles table.
            The table body starts empty because rows are rendered dynamically by portfolio-asset-profiles.js.
            Each rendered row includes Edit and Delete buttons.
            -->
            <div id="tableContainer" class="table-responsive d-none">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Symbol</th>
                        <th>Name</th>
                        <th>Asset Class</th>
                        <th>Sector</th>
                        <th>Market</th>
                        <th>Currency</th>
                        <th>Manual Valuation</th>
                        <th>Price Data Supported</th>
                        <th>Data Source</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="assetProfilesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!--
Create/Edit Asset Profile modal.
The same modal is reused for creating and editing asset profiles.
If assetProfileId is empty, JavaScript sends POST /api/asset-profiles.
If assetProfileId has a value, JavaScript sends PUT /api/asset-profiles/{id}.
-->
<div class="modal fade" id="assetProfileModal" tabindex="-1" aria-labelledby="assetProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="assetProfileForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="assetProfileModalLabel">Add Asset Profile</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <!-- Hidden ID used to decide create mode versus edit mode. -->
                    <input type="hidden" id="assetProfileId">

                    <div class="row g-3">
                        <!--
                        Asset search field.
                        This calls /api/assets/search as the user types.
                        Selecting a search result fills the form with basic metadata such as symbol, display name, market and currency.
                        -->
                        <div class="col-12">
                            <label for="assetSearch" class="form-label">Search Asset</label>
                            <input
                                    id="assetSearch"
                                    class="form-control"
                                    autocomplete="off"
                                    placeholder="Type asset name">
                            <div id="assetSearchResults" class="list-group mt-2 d-none"></div>
                            <div class="form-text">
                                Search and select a result.
                            </div>
                        </div>

                        <!--
                        Symbol uniquely identifies the market asset.
                        The JavaScript normalises it to uppercase before saving.
                        -->
                        <div class="col-md-6">
                            <label for="symbol" class="form-label">Symbol</label>
                            <input id="symbol" class="form-control" maxlength="50" required>
                        </div>

                        <!-- Display name is the user-friendly name shown in tables and pages. -->
                        <div class="col-md-6">
                            <label for="displayName" class="form-label">Display Name</label>
                            <input id="displayName" class="form-control" maxlength="150" required>
                        </div>

                        <!--
                        Asset class is important metadata.
                        It affects allocation grouping, assistant bucket mapping, and optimisation eligibility.
                        -->
                        <div class="col-md-4">
                            <label for="assetClass" class="form-label">Asset Class</label>
                            <select id="assetClass" class="form-select" required>
                                <option value="">Select</option>
                                <option value="CASH">CASH</option>
                                <option value="EQUITY">EQUITY</option>
                                <option value="ETF">ETF</option>
                                <option value="BOND">BOND</option>
                                <option value="REAL_ESTATE">REAL_ESTATE</option>
                                <option value="CRYPTO">CRYPTO</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </div>

                        <!-- Sector is used by allocation analysis to group portfolio exposure by sector. -->
                        <div class="col-md-4">
                            <label for="sector" class="form-label">Sector</label>
                            <input id="sector" class="form-control" maxlength="100">
                        </div>

                        <!-- Market is used by allocation analysis to group holdings by market/exchange/region. -->
                        <div class="col-md-4">
                            <label for="market" class="form-label">Market</label>
                            <input id="market" class="form-control" maxlength="100">
                        </div>

                        <!-- Currency is used for display and valuation context. It is normalised to uppercase in JavaScript. -->
                        <div class="col-md-4">
                            <label for="currency" class="form-label">Currency</label>
                            <input id="currency" class="form-control" maxlength="3" required>
                        </div>

                        <!--
                        Data source records where metadata or prices are expected to come from.
                        In the current project, Alpha Vantage is the main market data provider.
                        -->
                        <div class="col-md-4">
                            <label for="dataSource" class="form-label">Data Source</label>
                            <select id="dataSource" class="form-select" required>
                                <option value="ALPHA_VANTAGE">ALPHA_VANTAGE</option>
                                <option value="YAHOO_FINANCE">YAHOO_FINANCE</option>
                                <option value="MANUAL">MANUAL</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </div>

                        <!--
                        Manual Valuation flag.
                        If true, downstream services should not rely mainly on external market price data for this asset.
                        Useful for assets such as real estate or manually valued assets.
                        -->
                        <div class="col-md-2 form-check mt-4">
                            <input id="manualValuationRequired" class="form-check-input" type="checkbox">
                            <label for="manualValuationRequired" class="form-check-label">Manual Valuation</label>
                        </div>

                        <!--
                        Price Data Supported flag.
                        If false, services such as holdings/optimisation should avoid trying to fetch market prices for this asset.
                        -->
                        <div class="col-md-2 form-check mt-4">
                            <input id="priceDataSupported" class="form-check-input" type="checkbox" checked>
                            <label for="priceDataSupported" class="form-check-label">Price Supported</label>
                        </div>
                    </div>

                    <!--
                    Form-level error container.
                    Used for validation or save errors inside the modal.
                    -->
                    <div id="formError" class="alert alert-danger mt-3 d-none"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="saveAssetProfileButton" class="btn btn-primary">Save Asset Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap is required for the modal. portfolio-asset-profiles.js controls CRUD, search, rendering and metadata enrichment. -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/portfolio-asset-profiles.js}"></script>
</body>
</html>
